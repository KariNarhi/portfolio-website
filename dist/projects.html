<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
      integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap"
    />
    <script>
      document.documentElement.classList.add("i18n-loading");
    </script>
    <link rel="stylesheet" href="css/main.css" />
    <title>Projects</title>
  </head>
  <body>
    <header>
      <div class="menu-btn">
        <div class="btn-line"></div>
        <div class="btn-line"></div>
        <div class="btn-line"></div>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="fi">FI</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <nav class="menu">
        <div class="menu-branding">
          <div class="portrait"></div>
          <ul class="contact-info">
            <li>
              <a href="#"
                ><i class="fa fa-envelope"></i> example@example.com</a
              >
            </li>
            <li><i class="fa fa-phone"></i> <span data-i18n="common.redacted">Redacted for privacy</span></li>
            <li><i class="fa fa-map-marker"></i> <span data-i18n="common.redacted">Redacted for privacy</span></li>
          </ul>
          <div class="menu-icons">
            <a href="#">
              <i class="fa fa-facebook-official fa-2x"></i>
            </a>
            <a href="#">
              <i class="fa fa-linkedin-square fa-2x"></i>
            </a>
            <a href="#">
              <i class="fa fa-github fa-2x"></i>
            </a>
          </div>
        </div>
        <ul class="menu-nav">
          <li class="nav-item">
            <a href="index.html" class="nav-link" data-i18n="menu.home">Home</a>
          </li>
          <li class="nav-item">
            <a href="about.html" class="nav-link" data-i18n="menu.about">About Me</a>
          </li>
          <li class="nav-item current">
            <a href="projects.html" class="nav-link" data-i18n="menu.projects">Projects</a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link" data-i18n="menu.contact">Contact Me</a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="projects">
      <h1 class="lg-heading" data-i18n="[html]projects.title">My <span class="text-secondary">Projects</span></h1>
      <h2 class="sm-heading" data-i18n="projects.subtitle">Check these out...</h2>
      <div class="projects">
        <div class="item">
          <a href="#">
            <img src="img/projects/project1.jpg" alt="project1" />
          </a>
          <span class="btn-light disabled">
            <i class="fa fa-eye"></i> <span data-i18n="projects.notPublished">Project not published</span>
          </span>
          <a href="#" class="btn-dark">
            <i class="fa fa-github"></i> GitHub
          </a>
        </div>
        <div class="item">
          <a href="#">
            <img src="img/projects/project2.jpg" alt="project2" />
          </a>
          <span class="btn-light disabled">
            <i class="fa fa-eye"></i> <span data-i18n="projects.notPublished">Project not published</span>
          </span>
          <a href="#" class="btn-dark">
            <i class="fa fa-github"></i> GitHub
          </a>
        </div>
      </div>
    </main>
    <footer id="main-footer" data-i18n="[html]footer.copyright">
      Copyright &copy; 2026
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/i18next@27.2.9/dist/umd/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@4.1.2/i18nextHttpBackend.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
